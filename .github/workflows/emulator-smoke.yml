name: Headless GBA emulator smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless-mgba:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM toolchain and mGBA 0.10.5
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-arm-none-eabi binutils-arm-none-eabi libmgba-dev
      - name: Build standard GBA cartridge
        run: make -j2
      - name: Compile headless emulator smoke probe
        run: cc -O2 -std=c99 -Wall tests/gba_emulator_smoke.c -lmgba -lm -o build/gba_emulator_smoke
      - name: Boot and drive by virtual controller (no RAM writes)
        run: |
          set -euo pipefail
          mkdir -p build/emulator-smoke
          DRAW=$(arm-none-eabi-nm -g build/notracin.elf | awk '$3=="g_frames" {print $1}')
          RACE=$(arm-none-eabi-nm -g build/notracin.elf | awk '$3=="g_race" {print $1}')
          test -n "$DRAW" && test -n "$RACE"
          build/gba_emulator_smoke notracin.gba "$DRAW" "$RACE" build/emulator-smoke | tee build/emulator-smoke/results.jsonl
          OPT=$(arm-none-eabi-nm -g build/notracin.elf | awk '$3=="g_opt" {print $1}')
          MODEL=$(arm-none-eabi-nm -g build/notracin.elf | awk '$3=="car_physics_profile" {print $1}')
          test -n "$OPT" && test -n "$MODEL"
          for MODE in 2 3; do
            mkdir -p "build/emulator-smoke/physics-$MODE"
            build/gba_emulator_smoke notracin.gba "$DRAW" "$RACE" "build/emulator-smoke/physics-$MODE" 0 0 "$MODE" "$OPT" "$MODEL" | tee "build/emulator-smoke/physics-$MODE/results.jsonl"
          done
          MOTION=$(arm-none-eabi-nm -g build/notracin.elf | awk '$3=="car_motion_profile" {print $1}')
          test -n "$MOTION"
          for HANDLE in 1 3; do
            mkdir -p "build/emulator-smoke/newton-$HANDLE"
            build/gba_emulator_smoke notracin.gba "$DRAW" "$RACE" "build/emulator-smoke/newton-$HANDLE" 0 0 "$HANDLE" "$OPT" "$MODEL" 1 "$MOTION" | tee "build/emulator-smoke/newton-$HANDLE/results.jsonl"
          done
      - name: Publish real emulator captures and telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: no-tracin-headless-mgba-evidence
          path: build/emulator-smoke/
          if-no-files-found: warn
          retention-days: 14
